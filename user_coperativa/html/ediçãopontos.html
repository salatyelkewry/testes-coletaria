<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Pontos</title>
    <link rel="icon" href="../img/logo 1.png">
    <!-- Carrega o Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Configuração do Tailwind para a fonte Inter e cores customizadas (se necessário) -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'custom-red': '#D32F2F', // Vermelho para os botões EDITAR
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Estilo para simular o corpo de um aplicativo móvel */
        body {
            background-color: #f7f7f7; /* Fundo levemente cinza */
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 0;
            margin: 0;
        }
        /* Container principal para simular o "viewport" do celular */
        .phone-mockup {
            width: 100%;
            max-width: 400px; /* Largura máxima típica de um mobile */
            min-height: 100vh;
            background-color: white;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            position: relative;
            padding-top: 60px; /* Espaço para o header fixo */
            font-family: 'Inter', sans-serif;
        }

        /* Card de destaque com borda arredondada e sombra */
        .card-highlight {
            border-left: 5px solid #4CAF50;
            border-right: 5px solid #4CAF50;
            background-color: #EEFFEE; /* Fundo muito claro, quase branco, com toque verde */
        }

        /* Gradient text for the number */
        .gradient-text {
            background: linear-gradient(to right, #00FE5B, #006F4A);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        /* Estilização específica do ícone de lixeira (simulação) */
        .trash-icon-container {
            width: 80px;
            height: 90px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(to bottom, #00FE5B, #006F4A);
            border-radius: 8px 8px 0 0;
            clip-path: polygon(0 0, 100% 0, 90% 100%, 10% 100%);
        }

        .trash-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70%; /* Nível de preenchimento (simulação) */
            background: linear-gradient(to bottom, #00FE5B, #006F4A);
        }

        /* Estilização para o ponto de localização */
        .location-marker {
            width: 1.5rem;
            height: 1.5rem;
            color: #D32F2F; /* Vermelho para o marcador */
        }

        /* Linha conectora vertical */
        .location-line {
            width: 2px;
            background-color: #FF0101;
            margin-left: 0.5rem; /* Alinha com o centro do marcador */
        }
    </style>
    <!-- Ícone da seta de voltar (SVG) -->
    <script>
        const backArrow = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
        </svg>`;
        
        // Ícone de localização (SVG simples para o marcador)
        const locationPin = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="location-marker">
            <path fill-rule="evenodd" d="M11.54 22.351A8.25 8.25 0 012.25 10.5a8.288 8.288 0 018.795-8.283C11.666 2.457 12 3.84 12 5.25c0 1.414-.333 2.802-.855 4.225A8.288 8.288 0 0110.5 18v2.25l1.04-.347c.504-.168 1.053-.255 1.603-.255.485 0 .97.065 1.455.195.45.123.906.262 1.365.405a.75.75 0 00.93.303l.035-.015a.75.75 0 00.316-1.157l-.147-.21a1.272 1.272 0 011.082-.572c.453 0 .895.078 1.33.234l.325.116a.75.75 0 00.93-.303l.035-.015a.75.75 0 00.316-1.157l-.234-.325c.348-.124.686-.273 1.018-.456.46-.251.896-.54 1.312-.867l.142-.117a.75.75 0 00-.916-1.242zM12 18.75c3.55 0 6.436-2.903 6.436-6.471 0-3.568-2.887-6.47-6.436-6.47s-6.436 2.902-6.436 6.47c0 3.568 2.886 6.47 6.436 6.47zm-1.06-4.597a1.125 1.125 0 102.12 0 1.125 1.125 0 00-2.12 0z" clip-rule="evenodd" />
        </svg>`;
    </script>
</head>
<body>

    <!-- Container principal (simulação de tela de celular) -->
    <div class="phone-mockup">

        <!-- Header Fixo (EDITAR PONTOS) -->
        <header class="fixed top-0 max-w-[400px] w-full bg-white z-10 shadow-sm flex items-center justify-center p-4 border-b">
            <button class="absolute left-4 p-1 text-gray-800" onclick="window.location.href='detalhesfrota.html'">
                <script>document.write(backArrow);</script>
            </button>
            <h1 class="text-xl font-bold tracking-widest text-gray-800">EDITAR PONTOS</h1>
        </header>

        <!-- Conteúdo da Página -->
        <main class="p-4 pt-0">

            <!-- Card de Destaque -->
            <div class="card-highlight rounded-xl p-4 mb-8 flex justify-between items-center shadow-lg">
                <div class="flex-grow">
                    <p class="text-sm font-bold text-gray-700 leading-tight">MOTORISTA: Joãozinho</p>
                    <p class="text-sm font-bold text-gray-700 leading-tight mt-1">PLACA: SBT1234</p>
                    <p class="text-xs font-bold text-gray-700 mt-2">TOTAL DE LIXO COLETADO:</p>
                </div>

                <!-- Ilustração do Ícone de Lixeira -->
                <div class="flex-shrink-0 relative flex items-end">
                    <p class="text-4xl font-extrabold mr-2"><span class="gradient-text">412</span><span class="text-lg ml-1 font-semibold gradient-text">kg</span></p>
                    <img src="../img/lixeira2.png" alt="Lixeira" class="trash-icon" style="width: 90px; height: 90px; clip-path: polygon(0 0, 100% 0, 90% 100%, 10% 100%); box-shadow: 0 4px 8px rgba(0, 254, 91, 0.5), 0 8px 16px rgba(0, 111, 74, 0.3);">
                </div>
            </div>

            <!-- Lista de Pontos de Coleta -->
            <div class="flex flex-col space-y-4">
                <!-- Ponto de Coleta 1 -->
                <div class="flex items-start">
                    <!-- Icone de Localização e Linha -->
                    <div class="flex flex-col items-center mr-4 mt-1">
                        <img src="../img/local.png" alt="" style="width: 20px; height: 20px; margin-left: 10px;">

                        <div class="location-line h-20 -mt-1"></div>
                    </div>
                    <!-- Detalhes do Ponto -->
                    <div class="flex-grow flex justify-between items-center pb-4 border-b border-gray-200">
                        <span class="text-base font-bold text-gray-800">ATACADÃO DO VALE</span>
                        <button class="bg-custom-red text-white font-bold py-2 px-4 rounded-lg text-sm shadow-md transition duration-150 hover:bg-red-700"
                                onclick="alert('Editar Ponto: ATACADÃO DO VALE')">
                            EDITAR
                        </button>
                    </div>
                </div>

                <!-- Ponto de Coleta 2 -->
                <div class="flex items-start">
                    <div class="flex flex-col items-center mr-4 mt-1">
                      <img src="../img/local.png" alt="" style="width: 20px; height: 20px; margin-left: 10px;">

                        <div class="location-line h-16 -mt-1"></div>
                    </div>
                    <div class="flex-grow flex justify-between items-center pb-4 border-b border-gray-200">
                        <span class="text-base font-bold text-gray-800">BAR DO VALMAL</span>
                        <button class="bg-custom-red text-white font-bold py-2 px-4 rounded-lg text-sm shadow-md transition duration-150 hover:bg-red-700"
                                onclick="alert('Editar Ponto: BAR DO VALMAL')">
                            EDITAR
                        </button>
                    </div>
                </div>

                <!-- Ponto de Coleta 3 -->
                <div class="flex items-start">
                    <div class="flex flex-col items-center mr-4 mt-1">
                        <img src="../img/local.png" alt="" style="width: 20px; height: 20px; margin-left: 10px;">

                        <div class="location-line h-20 -mt-1"></div>
                    </div>
                    <div class="flex-grow flex justify-between items-center pb-4 border-b border-gray-200">
                        <span class="text-base font-bold text-gray-800">MERCADINHO NOVA OPÇÃO</span>
                        <button class="bg-custom-red text-white font-bold py-2 px-4 rounded-lg text-sm shadow-md transition duration-150 hover:bg-red-700"
                                onclick="alert('Editar Ponto: MERCADINHO NOVA OPÇÃO')">
                            EDITAR
                        </button>
                    </div>
                </div>

                <!-- Ponto de Coleta 4 -->
                <div class="flex items-start">
                    <div class="flex flex-col items-center mr-4 mt-1">
                        <img src="../img/local.png" alt="" style="width: 20px; height: 20px; margin-left: 10px;">

                        <div class="location-line h-20 -mt-1"></div>
                    </div>
                    <div class="flex-grow flex justify-between items-center pb-4 border-b border-gray-200">
                        <span class="text-base font-bold text-gray-800">ATACADÃO DO VALE</span>
                        <button class="bg-custom-red text-white font-bold py-2 px-4 rounded-lg text-sm shadow-md transition duration-150 hover:bg-red-700"
                                onclick="alert('Editar Ponto: ATACADÃO DO VALE')">
                            EDITAR
                        </button>
                    </div>
                </div>

                <!-- Ponto de Coleta 5 (Último ponto - sem linha abaixo) -->
                <div class="flex items-start">
                    <div class="flex flex-col items-center mr-4 mt-1">
                        <img src="../img/local.png" alt="" style="width: 20px; height: 20px; margin-left: 10px;">

                        <!-- Sem Linha Conectora após o último ponto -->
                    </div>
                    <div class="flex-grow flex justify-between items-center pb-4 border-b border-transparent">
                        <span class="text-base font-bold text-gray-800">ATACADÃO DO VALE</span>
                        <button class="bg-custom-red text-white font-bold py-2 px-4 rounded-lg text-sm shadow-md transition duration-150 hover:bg-red-700"
                                onclick="alert('Editar Ponto: ATACADÃO DO VALE')">
                            EDITAR
                        </button>
                    </div>
                </div>
            </div>

        </main>
    </div>

</body>
</html>
