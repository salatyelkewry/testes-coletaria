<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmação de Senha - ColetarAI</title>
    <link rel="icon" href="../img/logo 1.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <style>
        /* Estilos CSS (inalterados) */
        body {
            font-family: 'Inter', sans-serif;
            background-image: url('../img/floresta.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        
        .login-card {
            background-color: rgba(255, 255, 255, 0.95); 
            width: 100%; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 2rem;
        }
        .btn-gradient {
            background: linear-gradient(180deg, #38e35c 0%, #17a94d 100%);
            transition: all 0.2s ease-in-out;
        }
        .btn-gradient:hover {
            box-shadow: 0 4px 15px rgba(23, 169, 77, 0.4);
            opacity: 0.95;
        }
        .input-line {
            border-bottom: 1px solid #e5e7eb;
            transition: border-bottom-color 0.2s;
        }
        .input-line:focus-within {
            border-bottom-color: #17a94d;
        }
        .password-toggle {
            cursor: pointer;
            color: #17a94d;
        }
        @media (min-width: 640px) {
            .login-card {
                max-width: 420px;
                min-height: auto;
                height: auto;
                border-radius: 0.75rem;
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-0 sm:p-4">

    <div class="login-card">
        
        <div class="flex items-center justify-center mb-10">
            <img 
                src="../img/logo png.png" 
                alt="Ícone da Logo ColetarAI" 
                class="w-10 h-10 mr-2 object-contain"
                onerror="this.onerror=null; this.src='https://placehold.co/40x40/17a94d/ffffff?text=AI';"
            >
            <span class="text-3xl font-bold text-gray-800 tracking-tighter">ColetarAI</span>
        </div>

        <h1 class="text-3xl font-extrabold text-gray-900 mb-2">Confirmação</h1>
        <p class="text-sm font-medium text-green-600 mb-8">Confirme sua Senha</p>

        <form id="confirmForm" onsubmit="handleConfirm(event)">
            
            <div class="mb-6 input-line">
                <div class="flex items-center pb-2">
                    <svg class="w-5 h-5 mr-3 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 9V5a3 3 0 00-6 0v4m3 0a3 3 0 013 3v2a3 3 0 01-3 3"></path></svg>
                    <input type="password" id="confirmPassword" placeholder="Confirmar Senha" class="w-full text-gray-700 outline-none placeholder-gray-400" required>
                    
                    <span id="togglePassword" class="password-toggle">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path id="eyeIcon" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path id="eyePath" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                    </span>
                </div>
            </div>

            <div class="flex justify-between items-center mb-6 text-sm">
                <div class="flex items-center">
                    <input id="remember_me" name="remember_me" type="checkbox" class="h-4 w-4 rounded-sm border-gray-300 text-green-600 focus:ring-green-500" checked>
                    <label for="remember_me" class="ml-2 block text-gray-600">Lembre-me</label>
                </div>
                <a href="#" class="font-medium text-green-600 hover:text-green-700">Esqueceu a senha?</a>
            </div>

            <button type="submit" 
                class="btn-gradient w-full py-3 text-lg font-bold text-white rounded-lg shadow-lg">
                PRÓXIMO
            </button>
            
            <div class="mt-4 text-center text-sm text-gray-600">
                <a href="index.html" class="font-medium hover:text-gray-700">VOLTAR</a>
            </div>
            
        </form>

        <div id="statusMessage" class="mt-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg hidden" role="alert">
        </div>

    </div>

    <script>
        // FUNÇÃO DE CONFIRMAÇÃO ATUALIZADA
        function handleConfirm(event) {
            event.preventDefault(); 
            const confirmPassword = document.getElementById('confirmPassword').value;
            const statusMessage = document.getElementById('statusMessage');

            statusMessage.classList.add('hidden');
            statusMessage.innerHTML = '';
            
            // **PASSO CHAVE:** Recupera a senha salva na página anterior
            const previousPassword = localStorage.getItem('tempPassword');

            if (!previousPassword) {
                 showMessage('Erro: A senha original não foi encontrada. Retorne ao Login.', 'error');
                 return;
            }

            // Verifica se a senha de confirmação é igual à senha original
            if (confirmPassword !== previousPassword) {
                 showMessage('⚠️ As senhas não coincidem.', 'error');
                 return;
            }

            // Sucesso: As senhas coincidem, avança para a Home
            showMessage('Senhas confirmadas! Redirecionando para a Home...', 'success');

            // **REDIRECIONAMENTO FINAL:** Para home.html
            setTimeout(() => {
                 window.location.href = 'home.html';
                 // Limpa os dados de login temporários após o sucesso
                 localStorage.removeItem('tempPassword');
                 localStorage.removeItem('tempEmail');
            }, 1500); 
        }
        
        function showMessage(message, type) {
            statusMessage.classList.remove('hidden', 'bg-red-100', 'border-red-400', 'text-red-700', 'bg-green-100', 'border-green-400', 'text-green-700');
            if (type === 'error') {
                statusMessage.classList.add('bg-red-100', 'border-red-400', 'text-red-700');
            } else if (type === 'success') {
                statusMessage.classList.add('bg-green-100', 'border-green-400', 'text-green-700');
            }
            statusMessage.innerHTML = message;
        }

        // Função para alternar a visibilidade da senha (inalterada)
        document.getElementById('togglePassword').addEventListener('click', function () {
            const passwordInput = document.getElementById('confirmPassword');
            const eyeIcon = document.getElementById('eyeIcon');
            const eyePath = document.getElementById('eyePath');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.setAttribute('d', 'M15 12a3 3 0 11-6 0 3 3 0 016 0z');
                eyePath.setAttribute('d', 'M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z');
            } else {
                passwordInput.type = 'password';
                eyeIcon.setAttribute('d', 'M15 12a3 3 0 11-6 0 3 3 0 016 0z');
                eyePath.setAttribute('d', 'M10 12h2a3 3 0 003-3V7m-4 0v4m-4 0v2m-2-2h2a3 3 0 003 3v2m2-5a2 2 0 00-2-2H8');
            }
        });
    </script>
</body>
</html>
