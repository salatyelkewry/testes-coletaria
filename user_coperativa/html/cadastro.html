<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - ColetarAI</title>
    <link rel="icon" href="../img/logo 1.png">
    <!-- Carrega o Tailwind CSS para estilização -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <style>
        /* Define a fonte Inter como padrão */
        body {
            font-family: 'Inter', sans-serif;
            /* Fundo com a mesma imagem do login */
            background-image: url('img/fundo_login.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        
        /* Estilo para a área do cadastro (card branco) - Mesmo do login */
        .login-card {
            background-color: rgba(255, 255, 255, 0.95); 
            width: 100%; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 2rem;
        }

        /* Estilo do gradiente primário (Verde Vibrante) - Mesmo do login */
        .btn-gradient {
            background: linear-gradient(180deg, #38e35c 0%, #17a94d 100%);
            transition: all 0.2s ease-in-out;
        }
        .btn-gradient:hover {
            box-shadow: 0 4px 15px rgba(23, 169, 77, 0.4); 
            opacity: 0.95;
        }
        /* Estilo para a linha inferior dos inputs (Sublinhado) - Mesmo do login */
        .input-line {
            border-bottom: 1px solid #e5e7eb;
            transition: border-bottom-color 0.2s;
        }
        .input-line:focus-within {
            border-bottom-color: #17a94d;
        }

        /* Ajuste para telas maiores (desktop/tablet) - Mesmo do login */
        @media (min-width: 640px) {
            .login-card {
                max-width: 420px;
                min-height: auto;
                height: auto;
                border-radius: 0.75rem;
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-0 sm:p-4">

    <!-- Container Principal do Cadastro (responsivo) -->
    <div class="login-card">
        
        <!-- Logo e Nome da Empresa - Mesmo do login -->
        <div class="flex items-center mb-10">
            <img 
                src="img/logo png.png" 
                alt="Logo ColetarAI" 
                class="w-10 h-10 mr-2 object-contain"
                onerror="this.onerror=null; this.src='https://placehold.co/40x40/17a94d/ffffff?text=AI';"
            >
            <span class="text-3xl font-bold text-gray-800 tracking-tighter">ColetarAI</span>
        </div>

        <!-- Título -->
        <h1 class="text-3xl font-extrabold text-gray-900 mb-8">Cadastro</h1>

        <!-- Formulário de Cadastro -->
        <form id="registerForm" onsubmit="handleRegister(event)">
            
            <!-- Campo Nome -->
            <div class="mb-6 input-line">
                <div class="flex items-center pb-2">
                    <!-- Ícone de Pessoa -->
                    <svg class="w-5 h-5 mr-3 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    <input type="text" id="name" placeholder="Nome" class="w-full text-gray-700 outline-none placeholder-gray-400" required>
                </div>
            </div>

            <!-- Campo Email -->
            <div class="mb-6 input-line">
                <div class="flex items-center pb-2">
                    <!-- Ícone de Email (Envelope) -->
                    <svg class="w-5 h-5 mr-3 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8m-9 6l9-5.26M3 14h18a2 2 0 002-2V8a2 2 0 00-2-2H3a2 2 0 00-2 2v6a2 2 0 002 2z"></path></svg>
                    <input type="email" id="email" placeholder="Email" class="w-full text-gray-700 outline-none placeholder-gray-400" required>
                </div>
            </div>

            <!-- Campo Senha -->
            <div class="mb-6 input-line">
                <div class="flex items-center pb-2">
                    <!-- Ícone de Cadeado -->
                    <svg class="w-5 h-5 mr-3 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 9V5a3 3 0 00-6 0v4m3 0a3 3 0 013 3v2a3 3 0 01-3 3"></path></svg>
                    <input type="password" id="password" placeholder="Password" class="w-full text-gray-700 outline-none placeholder-gray-400" required>
                    <!-- A remoção do ícone de toggle de senha foi feita para seguir o layout da sua imagem de referência. -->
                </div>
            </div>
            
            <!-- Campo Confirmar Senha -->
            <div class="mb-6 input-line">
                <div class="flex items-center pb-2">
                    <!-- Ícone de Cadeado -->
                    <svg class="w-5 h-5 mr-3 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 9V5a3 3 0 00-6 0v4m3 0a3 3 0 013 3v2a3 3 0 01-3 3"></path></svg>
                    <input type="password" id="confirm_password" placeholder="Confirm Password" class="w-full text-gray-700 outline-none placeholder-gray-400" required>
                </div>
            </div>

            <!-- Lembre-me - Conforme a imagem -->
            <div class="flex items-center mb-6 text-sm">
                <input id="remember_me" name="remember_me" type="checkbox" class="h-4 w-4 rounded-sm border-gray-300 text-green-600 focus:ring-green-500" checked>
                <label for="remember_me" class="ml-2 block text-gray-600">Lembre-me</label>
            </div>

            <!-- Botão de Cadastro com Gradiente -->
            <button type="submit" class="btn-gradient w-full py-3 text-lg font-bold text-white rounded-lg shadow-lg">
                CADASTRE-SE
            </button>
        </form>

        <!-- Link para Login -->
        <div class="mt-8 text-center text-sm text-gray-600">
            Já tem uma conta?
            <!-- Link para a página de login -->
            <a href="index.html" class="font-medium text-green-600 hover:text-green-700">Entre aqui</a>
        </div>
        
        <!-- Mensagem de Status (não visível inicialmente) -->
        <div id="statusMessage" class="mt-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg hidden" role="alert">
            <!-- Mensagens de erro/sucesso aparecerão aqui -->
        </div>

    </div>

    <script>
        // Função para simular o processo de cadastro
        function handleRegister(event) {
            event.preventDefault(); // Impede o envio padrão do formulário
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const statusMessage = document.getElementById('statusMessage');

            // Limpa e esconde mensagens anteriores
            statusMessage.classList.add('hidden');
            statusMessage.innerHTML = '';
            statusMessage.classList.remove('bg-green-100', 'border-green-400', 'text-green-700', 'bg-red-100', 'border-red-400', 'text-red-700');


            // 1. Validação simples de campos vazios
            if (name === '' || email === '' || password === '' || confirmPassword === '') {
                statusMessage.classList.remove('hidden');
                statusMessage.classList.add('bg-red-100', 'border-red-400', 'text-red-700');
                statusMessage.innerHTML = 'Preencha todos os campos.';
                return;
            }

            // 2. Validação de senhas
            if (password !== confirmPassword) {
                statusMessage.classList.remove('hidden');
                statusMessage.classList.add('bg-red-100', 'border-red-400', 'text-red-700');
                statusMessage.innerHTML = 'As senhas não coincidem. Por favor, verifique.';
                return;
            }

            // 3. Validação de comprimento mínimo da senha (opcional, mas recomendado)
            if (password.length < 6) {
                statusMessage.classList.remove('hidden');
                statusMessage.classList.add('bg-red-100', 'border-red-400', 'text-red-700');
                statusMessage.innerHTML = 'A senha deve ter no mínimo 6 caracteres.';
                return;
            }

            // Simulação de cadastro bem-sucedido
            statusMessage.classList.remove('hidden');
            statusMessage.classList.add('bg-green-100', 'border-green-400', 'text-green-700');
            statusMessage.innerHTML = `Cadastro realizado com sucesso! Bem-vindo(a), ${name}. Redirecionando para o login...`;

            // Na aplicação real, aqui você faria a chamada para a API de cadastro
            // console.log('Dados de Cadastro:', { name, email, password });
            
            // Simula o redirecionamento após 3 segundos
            setTimeout(() => {
                 window.location.href = 'index.html'; // Redireciona para a página de login
            }, 3000);
        }

        // Não há função de toggle de senha, pois a imagem não a mostra.
    </script>
</body>
</html>
